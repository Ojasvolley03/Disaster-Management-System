<!DOCTYPE html>
<html>

<head>

<title>Disaster Awareness</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}


body{

min-height:100vh;

background:
radial-gradient(circle at top,#334155,#020617 70%);

padding:20px;

color:white;

overflow:auto;

}



/* PARTICLES */

.particles{

position:fixed;
inset:0;

background:
radial-gradient(circle,rgba(255,255,255,.25) 2px,transparent 3px);

background-size:80px 80px;

animation:move 20s linear infinite;

opacity:.25;

z-index:-1;

}


@keyframes move{

from{
background-position:0 0;
}

to{
background-position:500px 500px;
}

}





/* TOP BAR */


.topbar{

width:90%;

margin:auto;

padding:14px;

border-radius:25px;


background:
rgba(255,255,255,.08);


backdrop-filter:blur(15px);


display:flex;

justify-content:center;

gap:20px;


box-shadow:

0 20px 50px rgba(0,0,0,.7),
inset 0 0 20px rgba(255,255,255,.2);


}



.topbar button{

background:transparent;

color:white;

border:1px solid rgba(255,255,255,.5);

padding:10px 20px;

border-radius:30px;

cursor:pointer;

transition:.3s;

}



.topbar button:hover{

background:white;

color:#020617;

box-shadow:0 0 30px white;

transform:translateY(-5px);

}




h1{

text-align:center;

font-size:48px;

letter-spacing:5px;

margin:25px;


text-shadow:

0 0 30px white;

}






/* HERO */


.center{


width:90%;

height:420px;

margin:auto;


border-radius:30px;


background:

linear-gradient(
120deg,
#020617,
#1e293b,
rgba(255,255,255,.2)
),

url("rescue.jpg");


background-size:cover;

background-position:center;


padding:70px;


display:flex;

flex-direction:column;

justify-content:center;


position:relative;

overflow:hidden;


border:1px solid rgba(255,255,255,.25);


box-shadow:

0 30px 80px rgba(0,0,0,.8);


}



.center::before{


content:"";

position:absolute;

inset:0;


background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.25),
transparent
);


animation:shine 5s infinite;


}



@keyframes shine{


0%{

transform:translateX(-100%);

}


50%{

transform:translateX(100%);

}


100%{

transform:translateX(100%);

}


}



.center h2,
.center p,
.center a{

position:relative;

z-index:2;

}




.center h2{

font-size:55px;

text-shadow:0 0 25px white;

}



.center p{

font-size:20px;

line-height:1.7;

margin:20px 0;

max-width:600px;

}




.learn{


background:white;

color:#020617;

padding:15px 35px;

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;


box-shadow:

0 0 25px white;


transition:.3s;


}



.learn:hover{

transform:scale(1.1);

box-shadow:0 0 50px white;

}







/* REMOVE OLD BOXES */


.right{

display:none;

}





/* DISASTER CARDS */

.card img{

width:100px;

height:100px;

border-radius:70%;

object-fit:cover;

}
.left{

width:90%;

margin:35px auto;

}




.vertical,
.horizontal{


display:grid;

grid-template-columns:repeat(4,1fr);

gap:18px;

margin-bottom:20px;


}





.card{


height:140px;


background:

linear-gradient(
145deg,
rgba(255,255,255,.22),
rgba(255,255,255,.05)
);



border-radius:20px;


padding:18px;


border:1px solid rgba(255,255,255,.25);


backdrop-filter:blur(12px);


box-shadow:

0 20px 40px rgba(0,0,0,.6);


transition:.4s;


animation:float 4s ease-in-out infinite;


}





@keyframes float{

0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-8px);

}


}





.card:hover{


transform:

translateY(-15px)
rotateX(8deg);



box-shadow:

0 30px 70px rgba(255,255,255,.35);


}






.card img{


width:50px;

height:50px;

border-radius:50%;

object-fit:cover;


}



.card p{


margin:12px 0;

font-size:17px;

font-weight:bold;

}





.card button{


background:white;

color:#020617;

border:none;


padding:7px 18px;


border-radius:20px;


cursor:pointer;


box-shadow:

0 0 20px white;


}






/* POPUP */


.info{


position:fixed;


top:50%;

left:50%;


transform:translate(-50%,-50%);


width:330px;


background:white;


color:#020617;


padding:25px;


border-radius:20px;


display:none;


box-shadow:

0 25px 60px black;


}




.info h2{

margin-bottom:10px;

}





/* FOOTER */


.footer{


margin-top:40px;


text-align:center;


padding:20px;


background:

rgba(255,255,255,.08);


border-radius:20px;


backdrop-filter:blur(10px);


}



@media(max-width:900px){


.vertical,
.horizontal{

grid-template-columns:repeat(2,1fr);

}

}



@media(max-width:600px){


.vertical,
.horizontal{

grid-template-columns:1fr;

}



.center{

padding:35px;

}



.center h2{

font-size:35px;

}



.topbar{

flex-wrap:wrap;

}


}


</style>


</head>



<body>


<div class="particles"></div>




<div class="topbar">


<button onclick="location.href='index.html'">
Home
</button>


<button onclick="show('Emergency Guidelines')">
Guidelines
</button>


<button onclick="show('Flood and Earthquake Alert')">
Alert
</button>


<button onclick="show('Water Food First Aid Radio')">

</button>


<button onclick="show('Police 100 Fire 101 Ambulance 108')">
Numbers
</button>


</div>





<h1>
DISASTER AWARENESS
</h1>






<div class="main">





<div class="center">


<h2>

Safe Tomorrow

<p>

Be Prepared • Be Safe

<br>

Learn disaster safety methods,
emergency response and protection techniques.

</p>



<a href="about.html">


<button class="learn">

Learn More

</button>


</a>


</div>







<div class="left">





<div class="vertical">



<div class="card">

<img src="image/flood.png">

<p>Flood</p>

<a href="fload.html">

<button>▶</button>

</a>

</div>





<div class="card">

<img src="image/forestfire.png">

<p>Fire</p>

<a href="fire.html">

<button>▶</button>

</a>

</div>





<div class="card">

<img src="image/earth.png">

<p>Earthquake</p>

<a href="earth.html">

<button>▶</button>

</a>

</div>





<div class="card">

<img src="image/lighting.png
">

<p>Storm</p>

<a href="storm.html">

<button>▶</button>

</a>

</div>



</div>







<div class="horizontal">





<div class="card">

<img src="image/suni.png">

<p>Tsunami</p>

<a href="tus.html">

<button>▶</button>

</a>

</div>






<div class="card">

<img src="image/clo.png">

<p>Cyclone</p>

<a href="col.html">

<button>▶</button>

</a>

</div>





<div class="card">

<img src="image/landslide.png">

<p>Landslide</p>

<a href="land.html">

<button>▶</button>

</a>

</div>





<div class="card">

<img src="image/drought.png">

<p>Drought</p>

<a href="dro.html">

<button>▶</button>

</a>

</div>





</div>


</div>



</div>






<div class="info" id="info">


<h2>
Information
</h2>


<p id="text"></p>


</div>





<div class="footer">

DISASTER AWARENESS SYSTEM © 2026

<br>

Be Prepared • Be Safe

</div>






<script>


function show(data){


document.getElementById("info").style.display="block";


document.getElementById("text").innerHTML=data;



setTimeout(()=>{


document.getElementById("info").style.display="none";


},3000);


}



</script>



</body>
</html>
